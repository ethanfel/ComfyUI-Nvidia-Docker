# DXVK/NVAPI need a real, nonzero refresh rate. Default Xvfb modes can crash.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "DLSSDummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "DLSSMonitor"
    HorizSync 10.0-200.0
    VertRefresh 10.0-200.0
    Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
EndSection
Section "Screen"
    Identifier "DLSSScreen"
    Device "DLSSDummy"
    Monitor "DLSSMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "DLSSLayout"
    Screen "DLSSScreen"
EndSection
